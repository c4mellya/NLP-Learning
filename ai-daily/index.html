<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/ai-daily/">
<meta name="color-scheme" content="dark light">
<title>AI 日报 · NLP Learning</title>
<meta name="description" content="按日期阅读 AI 日报。">
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="../assets/theme-init.js?v=3"></script>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/course.css">
<link rel="stylesheet" href="daily.css">
<link rel="stylesheet" href="../assets/iconpark.css">
</head>
<body>
<header class="site-top">
  <div class="site-top-in">
    <a class="site-brand" href="../" aria-label="NLP Learning 课程总览"><img class="brand-logo" src="../assets/logo.svg" width="24" height="24" alt=""><span class="brand-text">NLP Learning</span></a>
    <div class="site-top-right">
      <a class="course-home-link" href="../">全部笔记 <span class="ip-icon ip-arrow-up-right" aria-hidden="true"></span></a>
      <a class="course-home-link" href="/ai-daily" aria-current="page">AI 日报</a>
      <button class="site-theme" type="button" data-theme-toggle aria-pressed="false"><span class="theme-ic ip-icon ip-moon" aria-hidden="true"></span><span class="theme-word">浅色</span></button>
    </div>
  </div>
</header>

<div class="site-shell is-plain">
  <main class="site-main daily-main" id="main">
    <nav class="course-breadcrumb" aria-label="面包屑"><a href="../">学习笔记</a><span aria-hidden="true">/</span><span>AI 日报</span></nav>
    <div class="daily-layout">
      <aside class="daily-history" aria-label="历史日报">
        <h2>往期日报</h2>
        <label class="daily-history-label" for="daily-select">选择日期</label>
        <select id="daily-select" aria-label="选择历史日报"></select>
        <nav id="daily-list" aria-label="按日期选择日报"></nav>
      </aside>
      <div class="daily-document">
        <header class="daily-report-head">
          <p class="course-eyebrow">AI DAILY / 每日记录</p>
          <h1 id="daily-title">AI 日报</h1>
          <time id="daily-date"></time>
          <p id="daily-head-meta" hidden></p>
        </header>
        <div class="daily-state"><p id="daily-status" role="status">正在加载 AI 日报...</p><a id="daily-latest" href="/ai-daily" hidden>查看最新日报</a></div>
        <details class="daily-toc" id="daily-toc" open hidden><summary>本期目录</summary><nav id="daily-toc-links" aria-label="本期内容目录"></nav></details>
        <article id="daily-content" aria-label="AI 日报正文" hidden></article>
      </div>
    </div>
  </main>
</div>
<script src="../assets/site.js?v=3"></script>
<script src="daily.js"></script>
</body>
</html>
